<?xml version="1.0" encoding="UTF-8"?>
<svg width="12" height="24" viewBox="0 0 12 24" xmlns="http://www.w3.org/2000/svg">
  <!-- 导弹主体 -->
  <path d="M6 2 L10 20 L6 18 L2 20 L6 2" 
        fill="#d4d4d4" 
        stroke="#808080" 
        stroke-width="1"/>
  
  <!-- 尾焰 -->
  <path d="M4 18 L6 24 L8 18" 
        fill="#ff6b00">
    <animate attributeName="d"
             values="M4 18 L6 24 L8 18;M4 18 L6 22 L8 18;M4 18 L6 24 L8 18"
             dur="0.2s"
             repeatCount="indefinite"/>
  </path>
  
  <!-- 发光效果 -->
  <circle cx="6" cy="10" r="4" 
          fill="none" 
          stroke="#ff6b00" 
          stroke-width="0.5" 
          opacity="0.3"/>
</svg>
