<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="40" viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg">
  <!-- UFO主体 -->
  <ellipse cx="32" cy="20" rx="30" ry="12" 
           fill="url(#ufoGradient)" 
           stroke="#50fa7b" 
           stroke-width="2"/>
  
  <!-- 驾驶舱 -->
  <ellipse cx="32" cy="20" rx="10" ry="6" 
           fill="#202634" 
           stroke="#50fa7b" 
           stroke-width="1.5"/>
  
  <!-- 扫描光束 -->
  <path d="M32 26 L32 40" 
        stroke="#50fa7b" 
        stroke-width="2" 
        opacity="0.6">
    <animate attributeName="opacity"
             values="0.6;0.2;0.6"
             dur="1s"
             repeatCount="indefinite"/>
  </path>
  
  <!-- 能量环 -->
  <circle cx="32" cy="20" r="16" 
          fill="none" 
          stroke="#50fa7b" 
          stroke-width="1" 
          opacity="0.3">
    <animate attributeName="r"
             values="16;18;16"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="ufoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#283593"/>
      <stop offset="100%" style="stop-color:#1a237e"/>
    </linearGradient>
  </defs>
</svg>
